name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.FOCS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/focs-release.jks"
            echo "FOCS_KEYSTORE_PATH=$RUNNER_TEMP/focs-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::FOCS_KEYSTORE_B64 secret not set; release APK is signed with a throwaway debug key."
          fi
      - name: Build release APK
        env:
          FOCS_KEYSTORE_PASSWORD: ${{ secrets.FOCS_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: focs-release-apk
          path: app/build/outputs/apk/release/app-release.apk
